default_install_hook_types: [commit-msg]

repos:
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.22.0
    hooks:
      - id: pyupgrade
        args: [--py312-plus]
        stages: [pre-commit]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
        args: [--fix, --ignore, TID251]
        stages: [pre-commit]
      - id: ruff
        args: [--ignore, TID251]
        stages: [pre-push]

  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
        stages: [pre-commit]
      - id: black
        args: [--check]
        stages: [pre-push]

  - repo: https://github.com/pycqa/isort
    rev: 8.0.1
    hooks:
      - id: isort
        stages: [pre-commit]
      - id: isort
        args: [--check-only]
        stages: [pre-push]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        pass_filenames: false
        additional_dependencies: ["types-PyYAML>=6.0.12,<7.0.0"]
        args: [ser, tests]
        stages: [pre-push]

  - repo: local
    hooks:
      - id: import-lint
        name: import-lint
        entry: bash scripts/run_import_lint.sh
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: attribution-guard-commit-msg
        name: attribution-guard (commit message)
        entry: python scripts/attribution_guard.py commit-msg
        language: python
        stages: [commit-msg]
      - id: attribution-guard-pre-push
        name: attribution-guard (pushed refs and commits)
        entry: python scripts/attribution_guard.py pre-push
        language: python
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: pyright
        name: pyright
        entry: uv run --frozen --extra dev pyright --pythonversion 3.12 ser tests
        language: system
        pass_filenames: false
        stages: [pre-push]
